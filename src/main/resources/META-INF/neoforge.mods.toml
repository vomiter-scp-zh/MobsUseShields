modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neurolib"
type="required"
versionRange="[0.3.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="entity_model_features"
type="optional"
versionRange="[3.3.12,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="illagersweararmor"
type="optional"
versionRange="[3.1.0,)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="mobsuseshields.mixins.json"
