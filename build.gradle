plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
    id 'idea'
    id 'com.vomiter.neoforge-base'
}

vomiterNeoForge {
    modId = mod_id
    // 你不需要改 expandTargets，因為 plugin 預設已對齊 META-INF/neoforge.mods.toml
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}


version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

apply from: 'gradle/neo-forge-runs.gradle'

dependencies {
    implementation "curse.maven:neurolib-1484243:7798811"
    compileOnly "curse.maven:entity-model-features-844662:8799082"
    compileOnly "curse.maven:entity-texture-features-fabric-568563:8789239"
    runtimeOnly "curse.maven:entity-model-features-844662:8799082"
    runtimeOnly "curse.maven:entity-texture-features-fabric-568563:8789239"

    compileOnly "curse.maven:illagers-wear-armor-407488:5552789"
    compileOnly "curse.maven:guard-villagers-360203:8230345"
    runtimeOnly "curse.maven:guard-villagers-360203:8230345"

}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}